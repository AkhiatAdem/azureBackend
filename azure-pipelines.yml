trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  # Updated to match your new folder name
  DJANGO_SETTINGS_MODULE: "myproject.settings"
  # This variable triggers the SQLite database switch in your settings.py
  AZURE_PIPELINES: "true"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: |
      python -m venv venv
      source venv/bin/activate
      pip install -r requirements.txt
    displayName: "1. Install Dependencies"

  - script: |
      source venv/bin/activate
      python manage.py check
    displayName: "2. Django System Check"

  - script: |
      source venv/bin/activate
      # This fails if you changed models but didn't run makemigrations
      python manage.py makemigrations --check --dry-run
    displayName: "3. Verify Pending Migrations"

  - script: |
      source venv/bin/activate
      python manage.py test
    displayName: "4. Run Unit Tests"

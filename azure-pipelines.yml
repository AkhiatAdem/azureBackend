trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  # Ensure this matches your ACTUAL folder name inside the repo
  DJANGO_SETTINGS_MODULE: "myproject.settings"
  AZURE_PIPELINES: "true"

steps:
  # 1. Start with the code
  - checkout: self
    persistCredentials: true
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  # 2. Quality Control
  - script: |
      # If requirements is in a folder, use: pip install -r your_folder/requirements.txt
      pip install -r requirements.txt
      python manage.py check
      python manage.py test
    displayName: "Run Tests & Checks"

  # 3. The Sync (Only happens if tests pass)
  - script: |

      # Ensure local 'main' is ready
      git checkout main || git checkout -b main

      # Use the token securely to push
      git remote remove github || true
      git remote add github https://x-access-token:$(GH_TOKEN)@github.com/AkhiatAdem/azureBackend.git

      git push github main --force
    displayName: "Sync to GitHub"
    env:
      GH_TOKEN: $(GH_TOKEN)

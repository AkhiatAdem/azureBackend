services:
  - type: web
    name: django-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-postgres-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: my-postgres-db
    plan: free